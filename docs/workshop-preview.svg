<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243042"/>
      <stop offset="100%" stop-color="#121821"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7eed1"/>
      <stop offset="100%" stop-color="#e7d4a3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Gold frame to echo the in-game parchment/gold palette -->
  <rect x="26" y="26" width="972" height="972" rx="30" fill="none" stroke="#c9a24c" stroke-width="4" opacity="0.5"/>

  <!-- Faint hex-grid "fog being revealed" motif behind the compass -->
  <g stroke="#c9a24c" stroke-width="2" fill="none" opacity="0.12">
    <path d="M512 250 l70 40 v80 l-70 40 l-70 -40 v-80 Z"/>
    <path d="M652 250 l70 40 v80 l-70 40 l-70 -40 v-80 Z"/>
    <path d="M372 250 l70 40 v80 l-70 40 l-70 -40 v-80 Z"/>
    <path d="M582 370 l70 40 v80 l-70 40 l-70 -40 v-80 Z"/>
    <path d="M442 370 l70 40 v80 l-70 40 l-70 -40 v-80 Z"/>
  </g>

  <!-- Compass rose: any unit can find its own way across the map -->
  <g transform="translate(512,410)">
    <circle r="196" fill="none" stroke="#c9a24c" stroke-width="6" opacity="0.55"/>
    <circle r="150" fill="none" stroke="#c9a24c" stroke-width="3" opacity="0.35"/>
    <!-- Diagonal (secondary) star, set behind -->
    <path d="M0,-150 L26,-26 L150,0 L26,26 L0,150 L-26,26 L-150,0 L-26,-26 Z"
          transform="rotate(45)" fill="url(#parchment)" opacity="0.45"
          stroke="#c9a24c" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Cardinal (primary) star -->
    <path d="M0,-176 L34,-34 L176,0 L34,34 L0,176 L-34,34 L-176,0 L-34,-34 Z"
          fill="url(#parchment)" stroke="#c9a24c" stroke-width="2.4" stroke-linejoin="round"/>
    <circle r="26" fill="#243042" stroke="#c9a24c" stroke-width="3"/>
    <circle r="8" fill="#c9a24c"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="512" y="726" font-size="96" font-weight="bold" letter-spacing="2"
          fill="url(#parchment)">UNIVERSAL</text>
    <text x="512" y="826" font-size="96" font-weight="bold" letter-spacing="6"
          fill="url(#parchment)">AUTO&#160;EXPLORE</text>
    <text x="512" y="902" font-size="38" letter-spacing="1"
          fill="#c9a24c">Send any unit to reveal the map</text>
  </g>
</svg>
