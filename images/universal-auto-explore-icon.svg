<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Universal Auto Explore</title>
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7eed1"/>
      <stop offset="100%" stop-color="#e7d4a3"/>
    </linearGradient>
  </defs>
  <!-- Compass rose: any unit can find its own way across the map -->
  <g transform="translate(32,32)">
    <circle r="29" fill="none" stroke="#c9a24c" stroke-width="2.5"/>
    <path d="M0,-24 L4.5,-4.5 L24,0 L4.5,4.5 L0,24 L-4.5,4.5 L-24,0 L-4.5,-4.5 Z"
          transform="rotate(45)" fill="url(#parchment)" opacity="0.5"
          stroke="#c9a24c" stroke-width="1" stroke-linejoin="round"/>
    <path d="M0,-28 L5.5,-5.5 L28,0 L5.5,5.5 L0,28 L-5.5,5.5 L-28,0 L-5.5,-5.5 Z"
          fill="url(#parchment)" stroke="#c9a24c" stroke-width="2" stroke-linejoin="round"/>
    <circle r="4.5" fill="#243042" stroke="#c9a24c" stroke-width="1.6"/>
  </g>
</svg>
